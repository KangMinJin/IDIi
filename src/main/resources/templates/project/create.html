<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프로젝트 생성 | IDI!</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/project-create.css}">
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <div class="app-shell">
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>

        <main class="dashboard-main project-create-main">
            <div class="project-create-content">
                <div class="project-create-heading">
                    <span class="eyebrow">NEW PROJECT</span>
                    <h1>새 프로젝트 만들기</h1>
                    <p>팀의 새로운 업무 공간을 만들어 보세요.</p>
                </div>

                <section class="dashboard-card project-create-card">
                    <form th:action="@{/project/create}" method="post">
                        <div class="project-create-field">
                            <label for="title">프로젝트 이름 <span class="project-create-required">*</span></label>
                            <input type="text" id="title" name="title" maxlength="100"
                                   placeholder="예: IDI! 웹 서비스 개발" required>
                        </div>

                        <div class="project-create-field">
                            <label for="description">프로젝트 설명</label>
                            <textarea id="description" name="description" maxlength="500"
                                      placeholder="프로젝트의 목표와 내용을 입력하세요."></textarea>
                            <p class="project-create-hint">최대 500자까지 입력할 수 있습니다.</p>
                        </div>

                        <div class="project-create-date-row">
                            <div class="project-create-field">
                                <label for="startDate">시작일</label>
                                <input type="date" id="startDate" name="startDate">
                            </div>
                            <div class="project-create-field">
                                <label for="dueDate">마감일</label>
                                <input type="date" id="dueDate" name="dueDate">
                            </div>
                        </div>

                        <p class="project-create-error" th:if="${error}" th:text="${error}"></p>

                        <div class="project-create-actions">
                            <a th:href="@{/}" class="btn btn-outline">취소</a>
                            <button type="submit" class="btn btn-primary">프로젝트 생성</button>
                        </div>
                    </form>
                </section>
            </div>
        </main>
    </div>
</body>
</html>
