<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>이슈 등록 | IDI!</title>
  <link rel="stylesheet" th:href="@{/css/common.css}">
  <link rel="stylesheet" th:href="@{/css/work-form.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<div class="app-shell">
  <div th:replace="~{fragments/sidebar :: sidebar}"></div>
  <main class="dashboard-main work-form-main">
    <div class="work-form-wrap">
      <nav class="work-form-breadcrumb" aria-label="현재 위치">
        <a th:href="@{/project/detail(projectId=${projectId})}">프로젝트 상세</a><span aria-hidden="true">›</span><span>이슈 등록</span>
      </nav>
      <header class="work-form-heading">
        <span class="eyebrow">ISSUE MANAGEMENT</span>
        <h1>새 이슈 등록</h1>
        <p>프로젝트에 새로운 작업이나 버그를 등록합니다.</p>
      </header>
      <section class="dashboard-card work-form-card">
        <form class="work-form" th:action="@{/issue/create(projectId=${projectId})}" method="post">
          <div class="work-field">
            <label for="title">이슈 제목 <span class="work-required">*</span></label>
            <input id="title" name="title" type="text" maxlength="100" placeholder="이슈 제목을 입력하세요." required>
          </div>
          <div class="work-field">
            <label for="content">상세 내용</label>
            <textarea id="content" name="content" rows="6" placeholder="작업 내용 또는 버그 재현 절차를 작성하세요."></textarea>
          </div>
          <div class="work-field-row">
            <div class="work-field">
              <label for="type">이슈 유형</label>
              <select id="type" name="type"><option value="0">작업(Task)</option><option value="1">버그(Bug)</option></select>
            </div>
            <div class="work-field">
              <label for="priority">우선순위</label>
              <select id="priority" name="priority"><option value="0">낮음</option><option value="1" selected>보통</option><option value="2">높음</option></select>
            </div>
          </div>
          <div class="work-field">
            <label for="dueDate">마감일</label>
            <input type="date" id="dueDate" name="dueDate">
          </div>
          <div class="work-form-actions">
            <a class="btn btn-outline" th:href="@{/project/detail(projectId=${projectId})}">취소</a>
            <button type="submit" class="btn btn-primary">이슈 등록</button>
          </div>
        </form>
      </section>
    </div>
  </main>
</div>
</body>
</html>
