
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 | IDI!</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <script th:src="@{/js/signup.js}" defer></script>
</head>
<body>

    <div th:replace="~{fragments/header :: header}"></div>

    <main class="auth-main">
        <section class="auth-card">

            <div class="auth-heading">
                <h1>IDI! 시작하기</h1>
                <p>함께 프로젝트를 완성할 준비가 되었나요?</p>
            </div>

            <form th:action="@{/user/signup}"
                  method="post"
                  id="signupForm"
                  novalidate>

                <div class="auth-field">
                    <label for="email">이메일</label>
                    <input class="auth-input"
                           type="email"
                           id="email"
                           name="email"
                           placeholder="example@email.com"
                           maxlength="254"
                           autocomplete="email"
                           required>
                    <p class="auth-error" id="emailError" hidden></p>
                </div>

                <div class="auth-field">
                    <label for="password">비밀번호</label>
                    <input class="auth-input"
                           type="password"
                           id="password"
                           name="password"
                           placeholder="8~20자 입력"
                           minlength="8"
                           maxlength="20"
                           autocomplete="new-password"
                           required>
                    <p class="auth-hint">8~20자 이내로 입력해 주세요.</p>
                    <p class="auth-error" id="passwordError" hidden></p>
                </div>

                <div class="auth-field">
                    <label for="passwordConfirm">비밀번호 확인</label>
                    <input class="auth-input"
                           type="password"
                           id="passwordConfirm"
                           name="passwordConfirm"
                           placeholder="비밀번호를 다시 입력하세요"
                           autocomplete="new-password"
                           required>
                    <p class="auth-error" id="confirmError" hidden></p>
                </div>

                <div class="auth-field">
                    <label for="nickname">닉네임</label>
                    <input class="auth-input"
                           type="text"
                           id="nickname"
                           name="nickname"
                           placeholder="사용할 닉네임"
                           maxlength="30"
                           required>
                    <p class="auth-error" id="nicknameError" hidden></p>
                </div>

                <p class="auth-error auth-server-error"
                   th:if="${error}"
                   th:text="${error}"></p>

                <button type="submit" class="btn btn-primary auth-submit">
                    회원가입
                </button>

            </form>

            <p class="auth-bottom">
                이미 회원이신가요?
                <a th:href="@{/user/login}">로그인하기</a>
            </p>

        </section>
    </main>

</body>
</html>
